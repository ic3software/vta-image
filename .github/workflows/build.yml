name: Build & Push VTA Image

on:
  workflow_dispatch:
    inputs:
      vta_version:
        description: "VTA version"
        required: true
        default: "0.9.0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vta

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VTA_VERSION=${{ inputs.vta_version }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ inputs.vta_version }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
